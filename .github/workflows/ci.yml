name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: vet, build, test
    runs-on: ubuntu-latest
    env:
      # Coverage floor (issue #124). Conservative bar set below the
      # current ~75% so the gate catches gross regressions without
      # churning existing PRs. Raise as coverage improves.
      COVERAGE_THRESHOLD: "70"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Download modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./cmd/nexus

      # ── nexus check gate (issue #1248) ──────────────────────────
      # Runs the built binary's diagnostic suite (config validation,
      # Ollama connectivity, frontier key presence). Network-dependent
      # checks skip (not fail) when services are absent, so this is
      # safe in CI. Uses --json so jq can parse failures; falls back
      # to the exit code when jq is unavailable.
      - name: nexus check
        run: |
          set -euo pipefail
          # Build a binary we can invoke (matches go build above).
          go build -trimpath -o /tmp/nexus ./cmd/nexus

          OUTPUT=$(/tmp/nexus check --json 2>&1) || CHECK_EXIT=$?
          CHECK_EXIT=${CHECK_EXIT:-0}
          echo "$OUTPUT"

          # If the check exited non-zero and jq is available, surface
          # which checks failed in the GitHub Actions log.
          if [ "$CHECK_EXIT" -ne 0 ] && command -v jq &>/dev/null; then
            FAILS=$(echo "$OUTPUT" | jq -r '
              if type == "array" then
                [.[] | select(.status == "fail") | "\(.name): \(.message)"]
              else
                "nexus check exited \($CHECK_EXIT)"
              end
            ' | jq -r '.[]')
            if [ -n "$FAILS" ]; then
              echo "::error::nexus check failures:"
              echo "$FAILS"
            fi
          fi
          exit "$CHECK_EXIT"

      - name: go test (with race detector)
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.txt
          retention-days: 7

      # ── Coverage gate (issue #124) ───────────────────────────────
      # Fails the job if total coverage drops below COVERAGE_THRESHOLD.
      # The bar is deliberately conservative (see env above) so the
      # gate activates without blocking existing PRs. Per-package
      # numbers are printed for visibility but only the total gates.
      - name: Coverage gate
        run: |
          set -euo pipefail
          # Summarise per-package coverage for log visibility.
          echo "::group::Per-package coverage"
          go tool cover -func=coverage.txt | awk -F'\t+' '
            /^total:/ { next }
            { pkg[$1] += ($3+0); cnt[$1]++ }
            END {
              for (p in pkg) printf "%-50s %s\n", p, "(see func report above)"
            }
          ' || true
          echo "::endgroup::"
          # Extract the total percentage (last line of `cover -func`).
          TOTAL=$(go tool cover -func=coverage.txt | awk '/^total:/ { gsub("%","",$NF); print $NF }')
          echo "Total coverage: ${TOTAL}%"
          echo "Threshold:      ${COVERAGE_THRESHOLD}%"
          # awk handles float comparison (bash arithmetic is integer-only).
          awk -v t="${TOTAL}" -v c="${COVERAGE_THRESHOLD}" \
            'BEGIN { if (t+0 < c+0) {
                       printf "::error::Coverage %.1f%% is below the %.0f%% gate (COVERAGE_THRESHOLD).\n", t, c
                       exit 1
                     }
                     printf "::notice::Coverage %.1f%% meets the %.0f%% gate.\n", t, c
                   }'

  bench:
    # Non-blocking benchmark smoke run (issue #36). Uses -benchtime=100ms
    # via `make bench-short` so the whole suite stays under 30 s. Compare
    # the uploaded bench.txt against docs/BENCHMARKS.md for drift.
    name: bench (smoke)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Download modules
        run: go mod download

      - name: make bench-short
        run: make bench-short | tee bench.txt

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench
          path: bench.txt
          retention-days: 7

  # ── Benchmark regression detection (issue #1186) ────────────────
  # Runs benchmarks on the PR, compares against the stored baseline
  # (bench/baseline.txt) with benchstat, and posts the comparison
  # table as a PR comment. Non-blocking (continue-on-error) initially.
  # The threshold for flagging a regression is NEXUS_BENCH_REGRESSION_THRESHOLD
  # (default 15% on ns/op). Baseline is regenerated on develop merges.
  bench-regression:
    name: bench (regression check)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      NEXUS_BENCH_REGRESSION_THRESHOLD: "15"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      # Run benchmarks with -count=5 for statistical confidence.
      # -benchtime=100ms keeps the suite under ~30s on CI runners.
      - name: Run benchmarks
        run: go test -run='^$' -bench=. -benchmem -count=5 -benchtime=100ms ./... > pr.txt 2>&1 || true

      # Compare PR results against the stored baseline.
      # benchstat prints a table; we capture it for the PR comment
      # and check for regressions exceeding the threshold.
      - name: benchstat comparison
        id: benchstat
        run: |
          set -uo pipefail
          # Generate the comparison table.
          benchstat bench/baseline.txt pr.txt > benchstat-output.txt 2>&1 || true
          cat benchstat-output.txt

          # Check for regressions exceeding threshold on ns/op.
          # benchstat marks significant changes with "p < 0.05" and
          # shows the delta as a percentage. We look for lines where
          # the ns/op column shows a regression > threshold%.
          REGRESSIONS=$(awk -v threshold="${NEXUS_BENCH_REGRESSION_THRESHOLD}" '
            /^[A-Za-z]/ { name=$1 }
            /ns\/op/ && /\+[0-9]/ {
              # Extract percentage from columns containing +N.N%
              for (i=1; i<=NF; i++) {
                if ($i ~ /^\+[0-9]/) {
                  pct = $i; gsub(/[^0-9.]/, "", pct)
                  if (pct+0 > threshold+0) {
                    print name " regressed " pct "% on ns/op"
                  }
                }
              }
            }
          ' benchstat-output.txt || true)

          if [ -n "$REGRESSIONS" ]; then
            echo "::warning::Benchmark regressions detected exceeding ${NEXUS_BENCH_REGRESSION_THRESHOLD}%:"
            echo "$REGRESSIONS"
            echo "regressed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No benchmark regressions exceeding ${NEXUS_BENCH_REGRESSION_THRESHOLD}%."
            echo "regressed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload benchstat output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchstat
          path: |
            benchstat-output.txt
            pr.txt
          retention-days: 14

      # Post the comparison table as a PR comment (updates existing on re-run).
      - name: Post benchstat comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchstat
          message: |
            ## Benchmark comparison (benchstat)

            <details><summary>Comparison against <code>bench/baseline.txt</code></summary>

            ```
            ${{ steps.benchstat.outputs.regressed == 'true' && '⚠️ Regressions detected' || '✅ No significant regressions' }}

            ```

            ```benchstat
            $(cat benchstat-output.txt)
            ```

            </details>

            _Regression threshold: ${{ env.NEXUS_BENCH_REGRESSION_THRESHOLD }}% on ns/op · [How to interpret](../blob/develop/docs/BENCHMARKS.md#10-benchstat-regression-detection)_

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # golangci-lint v2.12.2 supports Go 1.25+ and replaces the old v1.x
      # series. The old comment about Go 1.24 is retained for context but
      # the lint job now uses the same Go 1.26 toolchain as the rest of CI.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  # ── Go native fuzz tests (issue #1161) ──────────────────────────
  # Runs each fuzz target for a bounded duration on develop pushes.
  # Non-blocking initially — fuzz failures surface as warnings, not
  # red builds.
  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Fuzz TOON compression
        run: go test -run='^$' -fuzz=FuzzSerializeToTOON -fuzztime=30s ./internal/middleware/

      - name: Fuzz DSL regex matching
        run: go test -run='^$' -fuzz=FuzzDSLRegex -fuzztime=30s ./internal/router/

      - name: Fuzz RAG similarity scoring
        run: go test -run='^$' -fuzz=FuzzSimilarity -fuzztime=30s ./internal/rag/

  # ── Docker image smoke build (issue #541) ───────────────────────
  # Builds the container image on every PR so a Dockerfile / go.mod Go
  # version drift can never again slip past CI undetected. Build only —
  # no push, no multi-arch, no signing. Release publishing stays in
  # release.yml. The Go-test guard (cmd/nexus/docker_build_test.go)
  # catches the version drift cheaply in every `go test` run; this job
  # catches Dockerfile-level breakage (syntax, missing COPY sources,
  # toolchain rejection) that the version comparison cannot.
  docker:
    name: docker build (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: docker build
        run: make docker-build
